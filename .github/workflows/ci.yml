name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: [17, 21]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        id: java17
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-java@v6
        id: java21
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check consumerSmokeTest -PtestJavaVersion=${{ matrix.java }} -Porg.gradle.java.installations.paths="${{ steps.java17.outputs.path }},${{ steps.java21.outputs.path }}"
        shell: bash
